backend:
  name: github
  repo: iaingalloway/iaingalloway-com
  branch: main
  squash_merges: true
publish_mode: editorial_workflow
site_url: https://iaingalloway.com
media_folder: site/assets/images

collections:
  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage
        file: site/content/_index.md
        fields:
          - label: Title
            name: title
            widget: string
          - label: Author
            name: author
            widget: string
          - label: Tagline
            name: tagline
            widget: string
          - label: Profile image
            name: image
            widget: string
          - label: Profile image alt text
            name: image_alt
            widget: string
          - label: Links
            name: links
            widget: list
            fields:
              - label: Text
                name: text
                widget: string
              - label: URL
                name: href
                widget: string
              - label: Icon
                name: icon
                widget: string
              - label: Style
                name: style
                widget: string
          - label: Body
            name: body
            widget: markdown
  - name: blog
    label: Blog post
    folder: site/content/blog
    filter:
      field: content-type
      value: post
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Post date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: Description
        name: description
        widget: text
        required: false
      - name: content-type
        widget: hidden
        default: post
      - label: Body
        name: body
        widget: markdown
