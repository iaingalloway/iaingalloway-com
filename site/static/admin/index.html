<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>
    <link href="/admin/config.yaml" type="text/yaml" rel="cms-config-url">
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms@0.193.2/dist/sveltia-cms.js"></script>
    <script>
      CMS.registerPreviewStyle('/css/main.css');

      function cssTextToStyleObject(cssText) {
        return (cssText || '').split(';').reduce(function(style, declaration) {
          var parts = declaration.split(':');
          var property = parts.shift();
          var value = parts.join(':');

          if (!property || !value) {
            return style;
          }

          property = property.trim().replace(/-([a-z])/g, function(match, letter) {
            return letter.toUpperCase();
          });

          style[property] = value.trim();

          return style;
        }, {});
      }

      function iconPreview(iconName) {
        if (!iconName) {
          return null;
        }

        return h('img', {
          src: '/img/icons/' + iconName + '.svg',
          alt: '',
          'aria-hidden': 'true',
          width: 20,
          height: 20,
          style: {
            display: 'inline',
            width: '1.25rem',
            height: '1.25rem',
            borderRadius: 0,
            margin: '0 0.25em 0 0',
            verticalAlign: 'middle',
            filter: 'brightness(0) invert(1)'
          }
        });
      }

      var HomepagePreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var links = entry.getIn(['data', 'links']) || [];

          if (typeof links.toJS === 'function') {
            links = links.toJS();
          }

          return h('article', { className: 'home' },
            h('img', {
              src: entry.getIn(['data', 'image']),
              alt: entry.getIn(['data', 'image_alt']),
              width: 150,
              height: 150
            }),
            h('header', {},
              h('h1', {}, entry.getIn(['data', 'author'])),
              h('h2', {}, entry.getIn(['data', 'tagline']))
            ),
            h('section', {}, this.props.widgetFor('body')),
            h('nav', {}, links.map(function(link, index) {
              return h('a', {
                key: index,
                href: link.href,
                className: 'link',
                style: cssTextToStyleObject(link.style)
              }, iconPreview(link.icon), h('span', {}, link.text));
            }))
          );
        }
      });

      var BlogPreview = createClass({
        render: function() {
          var entry = this.props.entry;

          return h('article', {},
            h('header', {},
              h('h1', {}, entry.getIn(['data', 'title'])),
              h('span', {}, entry.getIn(['data', 'date']))
            ),
            h('section', {}, this.props.widgetFor('body'))
          );
        }
      });

      CMS.registerPreviewTemplate('homepage', HomepagePreview);
      CMS.registerPreviewTemplate('blog', BlogPreview);
    </script>
  </body>
</html>
