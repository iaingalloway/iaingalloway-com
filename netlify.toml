[build]
  base = "site"
  publish = "public"
  command = "hugo --gc --minify -b $URL"

[build.environment]
  HUGO_VERSION = "0.153.0"
  HUGO_ENV = "production"

[[edge_functions]]
  path = "/song"
  function = "rickroll"

[[edge_functions]]
  path = "/spreadsheet"
  function = "rickroll"

[[edge_functions]]
  path = "/blogpost"
  function = "rickroll"
